services:
    postgres:
        image: postgres:16-alpine
        container_name: deadlock-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: deadlock_ai
            POSTGRES_USER: deadlock_ai
            POSTGRES_PASSWORD: deadlock_ai_local
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U deadlock_ai -d deadlock_ai"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: deadlock-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    redis_data:
