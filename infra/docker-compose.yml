services:
  postgres:
    image: postgres:16-alpine
    container_name: deadlock-postgres
    environment:
      POSTGRES_DB: deadlock_ai
      POSTGRES_USER: deadlock_ai
      POSTGRES_PASSWORD: deadlock_ai_local
    ports:
      "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    health:
      test: ["CMD-SHELL", "pg_isready -U deadlock_ai -d deadlock_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deadlock-redis
    ports:
      "6379:6379"
    volumes:
      - redis_data:/data
    health:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: