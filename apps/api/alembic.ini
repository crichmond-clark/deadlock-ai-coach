[alembic]
script_location = alembic
script = mako

# Used by env.py offline mode and sync path
sqlalchemy.url = postgresql+psycopg2://deadlock_ai:deadlock_ai_local@localhost:5432/deadlock_ai

# Path to this package (used for imports)
prepend_sys_path = .

# Only use the versions/ directory
file_template = %%(year)%%(month).%%(day)_%%(hour)%%(minute)%%(rev)s_%%(slug)s

# Revision ID for autogenerate
rev_id_header = True

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S